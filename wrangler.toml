# =============================================================================
# wrangler.toml
# Elparadisogonzalo production website
# =============================================================================

name = "elparadisogonzalo"

compatibility_date = "2026-09-21"
[previews]
# =============================================================================
# ASSETS
# =============================================================================
# Vite/build output
#
# Your production files should exist in:
#   ./dist/
#
# Enviroment:
#   ./dist/index.html
#   ./src
#
[assets]
directory = "./dist"

# =============================================================================
# PRODUCTION DOMAIN
# =============================================================================
# Cloudflare Custom Domain.
#
# Cloudflare manages the DNS record and TLS certificate for this hostname.
# This is preferable to manually managing certificates for the Worker.
#
[[routes]]
pattern = "elparadisogonzalo.net"
custom_domain = true
previews_enabled = true                                                                          

[[routes]]
pattern = "www.drive.elparadisogonzalo.net"
custom_domain = true
previews_enabled = true                                                                          

# =============================================================================
# OBSERVABILITY
# =============================================================================

[observability]
enabled = true
head_sampling_rate = 1

# =============================================================================
# DEPLOYMENT / SOURCE MAPS
# =============================================================================
