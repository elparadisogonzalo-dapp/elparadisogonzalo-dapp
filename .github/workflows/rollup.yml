name: Rollup Build

on:
  push:
    branches:
      - ghost
  pull_request:
    branches:
      - ghost
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: /.l2s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Rollup build
        run: pnpm exec rollup -c

      - name: Verify build output
        run: |
          echo "Build completed successfully."
          ls -lah dist/
